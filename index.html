<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 자율 자리 선택기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
    }
    .font-chalk {
      font-family: 'Gowun Dodum', sans-serif;
    }

    /* 책상 카드 애니메이션 및 스타일 */
    .seat-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .seat-card:hover:not(.seat-taken) {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 16px -2px rgba(99, 102, 241, 0.25);
    }
    .seat-taken {
      background-color: #e0e7ff !important;
      border-color: #6366f1 !important;
      color: #3730a3 !important;
    }
    .seat-mine {
      background-color: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
      animation: pulse-mine 2s infinite;
    }
    .seat-teacher-hover:hover {
      border-color: #ef4444 !important;
      background-color: #fee2e2 !important;
      color: #991b1b !important;
    }
    @keyframes pulse-mine {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- 입장 모달 (이름 입력) -->
  <div id="joinModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 md:p-8 shadow-2xl border border-slate-100 text-center">
      <div class="inline-flex p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-3">
        <i class="fa-solid fa-chair text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-900">실시간 자리 선택</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">이름을 적고 들어와서 원하는 자리를 누르세요!</p>

      <div class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-bold text-slate-600 mb-1">내 이름 또는 번호</label>
          <input type="text" id="studentNameInput" onkeyup="if(event.key==='Enter') enterClassroom()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none font-medium" placeholder="예: 박수민">
        </div>

        <button onclick="enterClassroom()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition active:scale-98 flex items-center justify-center gap-2">
          <span>교실 입장하기</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 상단 헤더 -->
  <header class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
          <i class="fa-solid fa-school text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">실시간 자율 자리 선택 교실</h1>
          <p id="userInfoText" class="text-xs text-slate-500">접속자: 이름을 입력해 주세요</p>
        </div>
      </div>

      <!-- 제어 및 상태 버튼 -->
      <div class="flex items-center gap-2 flex-wrap">
        <div class="bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5">
          <i class="fa-solid fa-users text-indigo-600"></i>
          <span>선택완료: <b id="selectedCount">0</b> / 29명</span>
        </div>

        <!-- 선생님/관리자 모드 토글 -->
        <button id="teacherModeBtn" onclick="toggleTeacherMode()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-gear"></i>
          <span>선생님 모드: <span id="teacherModeStatus" class="text-slate-500">OFF</span></span>
        </button>

        <!-- 중복 정리 버튼 (선생님 모드 시 표시 또는 항상 가능) -->
        <button onclick="cleanDuplicateSeats()" class="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-broom"></i>
          <span class="hidden sm:inline">중복 이름 정돈</span>
        </button>

        <!-- 전체 초기화 버튼 -->
        <button onclick="resetAllSeats()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-right"></i>
          <span class="hidden sm:inline">전체 초기화</span>
        </button>

        <button onclick="changeName()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition">
          이름 변경
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 교실 영역 -->
  <main class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- 상태 메시지 배너 -->
    <div id="statusBanner" class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl mb-6 flex items-center justify-between gap-4 shadow-sm transition">
      <div class="flex items-center gap-3 text-sm text-indigo-900">
        <span id="statusIcon" class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs shadow-sm">
          <i class="fa-solid fa-hand-pointer"></i>
        </span>
        <span id="statusMessage">원하는 책상을 클릭하면 자리가 즉시 등록됩니다!</span>
      </div>
    </div>

    <!-- 교실 본체 -->
    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-200/80">
      
      <!-- 칠판 & 교탁 -->
      <div class="relative mb-10">
        <div class="absolute -top-3 left-4 text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 flex items-center gap-1">
          <i class="fa-solid fa-door-open text-amber-700"></i> 앞문
        </div>
        <div class="absolute -top-3 right-4 text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 flex items-center gap-1">
          <i class="fa-solid fa-window-maximize text-blue-500"></i> 창문 쪽
        </div>

        <div class="w-full max-w-2xl mx-auto bg-emerald-900 border-8 border-amber-800 rounded-xl p-4 text-center shadow-lg">
          <p class="font-chalk text-amber-100 text-lg md:text-2xl tracking-wider font-semibold">
            칠 판 (앞 쪽)
          </p>
          <p class="text-xs text-emerald-300/80 mt-1">
            원하는 자리를 선택해 주세요
          </p>
        </div>

        <div class="w-24 h-9 bg-amber-700 border-2 border-amber-900 rounded-lg mx-auto mt-3 shadow-md flex items-center justify-center text-amber-100 text-xs font-bold">
          교탁
        </div>
      </div>

      <!-- 책상 레이아웃 (29석: 8명-8명-8명-5명) -->
      <div id="seatLayout" class="space-y-6 md:space-y-8 max-w-4xl mx-auto">
        <!-- JS로 실시간 생성됨 -->
      </div>

      <!-- 뒷문 표시 -->
      <div class="mt-10 pt-4 border-t border-slate-100 flex justify-between items-center text-xs font-bold text-slate-400">
        <div class="flex items-center gap-1 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">
          <i class="fa-solid fa-door-closed text-amber-700"></i> 뒷문
        </div>
        <div>[뒤 쪽]</div>
      </div>

    </div>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase 설정
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "demo", authDomain: "demo", projectId: "demo" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'classroom-seat-app';

    // 사용자 상태
    window.currentUser = null;
    window.userUid = localStorage.getItem('temp_student_uid') || `user_${Math.random().toString(36).substr(2, 9)}`;
    localStorage.setItem('temp_student_uid', window.userUid);

    window.studentName = '';
    window.seatData = {};
    window.isTeacherMode = false;
    const TOTAL_SEATS = 29;

    // 인증
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        console.warn("Auth initialization fallback:", e);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUser = user;
        window.userUid = user.uid;
      }
      listenToSeats();
    });

    initAuth();

    // 교실 입장 함수
    window.enterClassroom = function() {
      const nameInput = document.getElementById('studentNameInput');
      const name = nameInput.value.trim();

      if (!name) {
        alert('이름이나 번호를 입력해 주세요.');
        return;
      }

      window.studentName = name;
      document.getElementById('joinModal').classList.add('hidden');
      document.getElementById('userInfoText').innerText = `접속자: ${window.studentName}`;
      renderClassroom();
      listenToSeats();
    };

    window.changeName = function() {
      document.getElementById('joinModal').classList.remove('hidden');
    };

    // 선생님 모드 토글
    window.toggleTeacherMode = function() {
      window.isTeacherMode = !window.isTeacherMode;
      const statusEl = document.getElementById('teacherModeStatus');
      const btnEl = document.getElementById('teacherModeBtn');
      const banner = document.getElementById('statusBanner');
      const message = document.getElementById('statusMessage');

      if (window.isTeacherMode) {
        statusEl.innerText = 'ON (개별 자리 삭제 가능)';
        statusEl.className = 'text-amber-600 font-bold';
        btnEl.className = 'px-3 py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm';
        banner.className = 'bg-amber-50 border border-amber-300 p-4 rounded-2xl mb-6 flex items-center justify-between gap-4 shadow-sm transition';
        message.innerText = '선생님 모드 ON: 누르는 모든 자리를 강제로 비울 수 있습니다.';
      } else {
        statusEl.innerText = 'OFF';
        statusEl.className = 'text-slate-500';
        btnEl.className = 'px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5';
        banner.className = 'bg-indigo-50 border border-indigo-200 p-4 rounded-2xl mb-6 flex items-center justify-between gap-4 shadow-sm transition';
        message.innerText = '원하는 책상을 클릭하면 자리가 즉시 등록됩니다!';
      }
      renderClassroom();
    };

    // ★ 실시간 중복 데이터 자동으로 걸러주는 로직
    function filterDuplicates(rawSeats) {
      const cleanedSeats = {};
      const nameLatestSeat = {}; // 이름별로 가장 최근 선택된 자리 정보 저장

      // 모든 좌석을 순회하며 이름별 최신 선택 항목만 찾음
      Object.keys(rawSeats).forEach(seatKey => {
        const item = rawSeats[seatKey];
        if (item && item.name) {
          const existing = nameLatestSeat[item.name];
          const itemTime = item.time || 0;
          if (!existing || itemTime > existing.time) {
            nameLatestSeat[item.name] = { seatKey, item, time: itemTime };
          }
        }
      });

      // 최신 선택된 자리만 신규 객체에 보관
      Object.values(nameLatestSeat).forEach(({ seatKey, item }) => {
        cleanedSeats[seatKey] = item;
      });

      return { cleanedSeats, hasDuplicates: Object.keys(rawSeats).length !== Object.keys(cleanedSeats).length };
    }

    // 실시간 동기화
    let unsubscribe = null;
    function listenToSeats() {
      if (unsubscribe) unsubscribe();

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'main_classroom', 'seats');

      unsubscribe = onSnapshot(roomRef, async (snapshot) => {
        if (snapshot.exists()) {
          const rawSeats = snapshot.data().seats || {};
          const { cleanedSeats, hasDuplicates } = filterDuplicates(rawSeats);

          window.seatData = cleanedSeats;

          // 만약 기존 데이터에 중복(박수민 3개 등)이 있었다면 DB도 자동 보정 업데이트
          if (hasDuplicates) {
            await syncToFirestore();
          }
        } else {
          window.seatData = {};
        }
        renderClassroom();
      }, (err) => {
        console.error("Firestore Listen Error:", err);
      });
    }

    // [중복 이름 자동 정돈] 기능
    window.cleanDuplicateSeats = async function() {
      const { cleanedSeats, hasDuplicates } = filterDuplicates(window.seatData);
      window.seatData = cleanedSeats;
      renderClassroom();
      await syncToFirestore();
      if (hasDuplicates) {
        alert('중복 선택된 이름들을 정리하여 1인 1자리로 맞추었습니다!');
      } else {
        alert('중복된 자리가 없습니다. 깔끔합니다!');
      }
    };

    // 자리 선택 / 취소 / 삭제 처리
    window.handleSeatClick = async function(seatIndex) {
      const seatKey = `seat_${seatIndex}`;
      const occupant = window.seatData[seatKey];
      const myName = window.studentName;
      const myUid = window.userUid;

      // 0. 선생님 모드일 경우: 해당 자리가 누구의 자리이든 즉시 삭제 가능
      if (window.isTeacherMode) {
        if (!occupant) {
          alert('비어 있는 자리입니다.');
          return;
        }
        if (confirm(`'${occupant.name}' 학생의 자리를 강제로 비우시겠습니까?`)) {
          delete window.seatData[seatKey];
          renderClassroom();
          await syncToFirestore();
        }
        return;
      }

      // 학생 일반 모드
      if (!myName) {
        alert('먼저 이름을 입력해 주세요.');
        document.getElementById('joinModal').classList.remove('hidden');
        return;
      }

      const isMineOccupant = occupant && (occupant.name === myName || occupant.uid === myUid);

      // 1. 이미 다른 학생이 점유한 자리인 경우
      if (occupant && !isMineOccupant) {
        alert(`[${occupant.name}] 님이 이미 선택한 자리입니다.`);
        return;
      }

      // 2. 내가 선택한 자리를 다시 눌러 취소하는 경우
      if (isMineOccupant) {
        if (confirm('이 자리 선택을 취소하시겠습니까?')) {
          delete window.seatData[seatKey];
          renderClassroom();
          await syncToFirestore();
        }
        return;
      }

      // 3. 빈 자리를 선택하는 경우
      // ★ 나와 동일한 이름 또는 UID가 차지하고 있는 이전 모든 자리를 완벽히 삭제
      Object.keys(window.seatData).forEach(key => {
        const item = window.seatData[key];
        if (item && (item.name === myName || item.uid === myUid)) {
          delete window.seatData[key];
        }
      });

      // 새로운 자리에 등록
      window.seatData[seatKey] = {
        name: myName,
        uid: myUid,
        time: Date.now()
      };

      // 화면 즉시 그리기
      renderClassroom();

      // 서버 동기화
      await syncToFirestore();
    };

    // Firestore에 전체 seatData 안전하게 저장
    async function syncToFirestore() {
      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'main_classroom', 'seats');
        await setDoc(roomRef, { seats: window.seatData });
      } catch (err) {
        console.error("Firestore Sync Error:", err);
      }
    }

    // 전체 자리 초기화
    window.resetAllSeats = async function() {
      if (confirm('모든 학생의 자리 선택을 초기화하시겠습니까?')) {
        window.seatData = {};
        renderClassroom();
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'main_classroom', 'seats');
        await setDoc(roomRef, { seats: {} });
      }
    };

    // 화면 그리기 함수
    function renderClassroom() {
      const container = document.getElementById('seatLayout');
      if (!container) return;
      container.innerHTML = '';

      let seatIndex = 0;
      let count = 0;
      const myName = window.studentName;
      const myUid = window.userUid;

      for (let r = 0; r < 4; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = "flex justify-center items-center gap-3 md:gap-6 flex-wrap";

        const pairsInRow = (r < 3) ? 4 : 3;

        for (let p = 0; p < pairsInRow; p++) {
          const pairDiv = document.createElement('div');
          pairDiv.className = "flex gap-2 p-2 rounded-xl border border-slate-200 shadow-sm bg-slate-50";

          const seatsInThisPair = (r === 3 && p === 2) ? 1 : 2;

          for (let s = 0; s < seatsInThisPair; s++) {
            if (seatIndex < TOTAL_SEATS) {
              const idx = seatIndex;
              const seatKey = `seat_${idx}`;
              const occupant = window.seatData[seatKey];

              if (occupant) count++;

              const isMine = occupant && (occupant.name === myName || occupant.uid === myUid);
              const isTaken = occupant && !isMine;

              const seatBtn = document.createElement('button');
              seatBtn.onclick = () => window.handleSeatClick(idx);

              let dynamicClasses = "bg-white border-slate-300 hover:border-indigo-400 text-slate-700";
              if (isMine) {
                dynamicClasses = "seat-mine";
              } else if (isTaken) {
                dynamicClasses = window.isTeacherMode ? "seat-taken seat-teacher-hover" : "seat-taken";
              }

              seatBtn.className = `seat-card relative w-16 h-14 md:w-20 md:h-16 rounded-xl font-bold border-2 text-xs md:text-sm flex flex-col items-center justify-center shadow-sm cursor-pointer select-none transition ${dynamicClasses}`;

              seatBtn.innerHTML = `
                <span class="text-[10px] text-slate-400 font-normal absolute top-1 left-1.5">${idx + 1}</span>
                ${isMine ? '<span class="text-[9px] bg-green-500 text-white font-bold px-1 rounded absolute top-1 right-1">내 자리</span>' : ''}
                ${window.isTeacherMode && occupant ? '<span class="text-[9px] bg-rose-500 text-white font-bold px-1 rounded absolute top-1 right-1"><i class="fa-solid fa-xmark"></i></span>' : ''}
                <span class="font-bold truncate max-w-[90%] mt-1">
                  ${occupant ? occupant.name : '<span class="text-slate-300 font-normal">빈 자리</span>'}
                </span>
              `;

              pairDiv.appendChild(seatBtn);
              seatIndex++;
            }
          }
          rowDiv.appendChild(pairDiv);
        }
        container.appendChild(rowDiv);
      }

      const countEl = document.getElementById('selectedCount');
      if (countEl) countEl.innerText = count;
    }

    // 초기 화면 렌더링
    renderClassroom();
  </script>
</body>
</html>
